services:
  memoryconnect-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: memoryconnect-api
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./data:/data
      - ./uploads:/app/apps/api/uploads
    networks:
      - infrastructure_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memoryconnect-api.rule=Host(`api.memoryconnect.co.za`)"
      - "traefik.http.routers.memoryconnect-api.entrypoints=web,websecure"
      - "traefik.http.routers.memoryconnect-api.tls=true"
      - "traefik.http.services.memoryconnect-api.loadbalancer.server.port=4000"

  memoryconnect-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: memoryconnect-admin
    restart: unless-stopped
    networks:
      - infrastructure_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memoryconnect-admin.rule=Host(`admin.memoryconnect.co.za`)"
      - "traefik.http.routers.memoryconnect-admin.entrypoints=web,websecure"
      - "traefik.http.routers.memoryconnect-admin.tls=true"
      - "traefik.http.services.memoryconnect-admin.loadbalancer.server.port=80"

  memoryconnect-public:
    build:
      context: .
      dockerfile: Dockerfile.memorial
    container_name: memoryconnect-public
    restart: unless-stopped
    networks:
      - infrastructure_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memoryconnect-public.rule=Host(`memoryconnect.co.za`) || Host(`www.memoryconnect.co.za`)"
      - "traefik.http.routers.memoryconnect-public.entrypoints=web,websecure"
      - "traefik.http.routers.memoryconnect-public.tls=true"
      - "traefik.http.services.memoryconnect-public.loadbalancer.server.port=80"

  memoryconnect-sales-crm:
    build:
      context: .
      dockerfile: Dockerfile.sales-crm
    container_name: memoryconnect-sales-crm
    restart: unless-stopped
    networks:
      - infrastructure_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memoryconnect-sales-crm.rule=Host(`crm.memoryconnect.co.za`)"
      - "traefik.http.routers.memoryconnect-sales-crm.entrypoints=web,websecure"
      - "traefik.http.routers.memoryconnect-sales-crm.tls=true"
      - "traefik.http.services.memoryconnect-sales-crm.loadbalancer.server.port=80"

  memoryconnect-smartreach-ai:
    build:
      context: .
      dockerfile: Dockerfile.smartreach-ai
    container_name: memoryconnect-smartreach-ai
    restart: unless-stopped
    env_file:
      - smartreach.env.production
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in an untracked .env on the VM}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in an untracked .env on the VM}
    volumes:
      - ./data:/data
    networks:
      - infrastructure_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memoryconnect-smartreach-ai.rule=Host(`smartreach.memoryconnect.co.za`)"
      - "traefik.http.routers.memoryconnect-smartreach-ai.entrypoints=web,websecure"
      - "traefik.http.routers.memoryconnect-smartreach-ai.tls=true"
      - "traefik.http.services.memoryconnect-smartreach-ai.loadbalancer.server.port=80"

networks:
  infrastructure_default:
    external: true
