server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "index, follow" always;

  # NOTE: unlike the Memorial public site, there is deliberately NO /api/
  # proxy here. The Events frontend calls https://events-api.memoryconnect.co.za
  # directly, keeping the two products' runtimes fully separate.

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /manifest.webmanifest =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
