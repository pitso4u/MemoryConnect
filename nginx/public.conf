server {
  listen 80;
  server_name memoryconnect.co.za www.memoryconnect.co.za;

  # Redirect www to non-www
  if ($host = 'www.memoryconnect.co.za') {
    return 301 https://memoryconnect.co.za$request_uri;
  }

  # Redirect HTTP to HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name memoryconnect.co.za;

  # SSL certificates (configure with certbot or your provider)
  # ssl_certificate     /etc/ssl/certs/memoryconnect.co.za.pem;
  # ssl_certificate_key /etc/ssl/private/memoryconnect.co.za.key;
  # ssl_protocols TLSv1.2 TLSv1.3;
  # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  # ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "index, follow" always;

  # Proxy API requests to the backend
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Proxy sitemap to the API so it includes dynamic memorial pages
  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:4000/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /manifest.webmanifest =404;
  }

  location /brand/ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
